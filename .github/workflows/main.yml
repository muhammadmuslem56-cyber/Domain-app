name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Build Script
        run: |
          chmod +x scripts/build-apk.sh || chmod +x build-apk.sh || true
          if [ -f "scripts/build-apk.sh" ]; then
            bash scripts/build-apk.sh
          elif [ -f "build-apk.sh" ]; then
            bash build-apk.sh
          else
            echo "Script bulunamadi, mevcut dosyalar:"
            ls -la
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/*.apk'
